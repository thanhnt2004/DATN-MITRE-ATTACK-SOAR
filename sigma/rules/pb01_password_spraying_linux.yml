title: DATN PB01 Linux SSH Failed Password for Spraying Correlation
id: a61c040b-a0b8-4877-95c8-918c4c165e4f
status: experimental
description: Base SSH failure selection; correlation requires at least five distinct users from one source IP within five minutes.
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|contains: 'Failed password for'
  condition: selection
fields:
  - message
falsepositives:
  - Authorized lab tests or shared source addresses
level: medium
tags:
  - attack.credential-access
  - attack.t1110.003
