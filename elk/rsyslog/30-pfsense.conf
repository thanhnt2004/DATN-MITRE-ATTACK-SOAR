module(load="imudp")

template(name="pfSenseRaw" type="string" string="%rawmsg%\n")

ruleset(name="pfSenseRemote") {
  action(
    type="omfile"
    file="/var/log/pfsense.log"
    template="pfSenseRaw"
    fileCreateMode="0640"
    fileOwner="syslog"
    fileGroup="adm"
  )
  stop
}

input(type="imudp" port="5514" ruleset="pfSenseRemote")
