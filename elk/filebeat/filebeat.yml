filebeat.inputs:
  - type: filestream
    id: ubuntu-system
    enabled: true
    paths:
      - /var/log/syslog
      - /var/log/auth.log
    fields:
      log_source: ubuntu

  - type: filestream
    id: ubuntu-nginx
    enabled: true
    paths:
      - /var/log/nginx/flaskr_access.log
      - /var/log/nginx/flaskr_error.log
    fields:
      log_source: ubuntu

  - type: filestream
    id: pfsense-relay
    enabled: true
    paths:
      - /var/log/pfsense.log
    fields:
      log_source: pfsense

processors:
  - add_host_metadata: ~

output.logstash:
  hosts: ["18.139.50.205:5044"]
  ssl.certificate_authorities:
    - /etc/filebeat/certs/ca.crt
